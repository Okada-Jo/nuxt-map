name: Lint

on:
  pull_request:
    branches:
      - master

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
      - run: pnpm install
      - run: pnpm lint
